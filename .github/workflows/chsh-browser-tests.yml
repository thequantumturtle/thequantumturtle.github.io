name: CHSH game browser regression
on:
  push:
    branches: [master]
    paths:
      - '_pages/chsh-game.html'
      - '_pages/learn.md'
      - 'tests/test_chsh_game.py'
      - '.github/workflows/chsh-browser-tests.yml'
  pull_request:
    paths:
      - '_pages/chsh-game.html'
      - '_pages/learn.md'
      - 'tests/test_chsh_game.py'
      - '.github/workflows/chsh-browser-tests.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - run: pip install playwright
      - run: python -m playwright install chromium --with-deps
      - run: python tests/test_chsh_game.py
